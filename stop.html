<!doctype html>
<html lang="ja" data-page="stop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ご連絡の停止 — 千葉嵩太</title>
<style>
:root{--bg:#fafaf8;--fg:#1f1f1c;--mut:#66665f;--line:#e4e3dc;--card:#fff;--acc:#2f6f5e}
@media (prefers-color-scheme:dark){:root{--bg:#191917;--fg:#ecebe6;--mut:#a09f98;--line:#363632;--card:#22221f;--acc:#7cc4ab}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:72px 16px 64px}
h1{font-size:22px;margin:0 0 16px}
p{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
button{font:inherit;font-size:16px;padding:12px 20px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer;width:100%}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.muted{color:var(--mut);font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>今後のご連絡の停止</h1>
<div class="card" id="box">
<p>研究のデータ作業のお手伝いの件で、千葉嵩太からお送りしたメールについて、今後のご連絡を停止します。</p>
<p>よろしければ、下のボタンを押してください。確認のあと停止し、以後は一切お送りしません。</p>
<button id="btn" data-t="stop1" onclick="ask()">今後のご連絡を停止する</button>
<div id="confirm" hidden>
<p style="margin-top:4px"><b>本当に停止しますか？</b><br><span class="muted">停止すると、今後こちらからご連絡することはありません。</span></p>
<button id="yes" data-t="stop2" onclick="stop()">はい、停止します</button>
<button class="ghost" onclick="cancel()" style="margin-top:8px">やめる</button>
</div>
<p class="muted" id="msg" style="margin-top:12px"></p>
</div>
<p class="muted" style="margin-top:20px">ボタンがうまく動かない場合は、お送りしたメールに「不要」とひと言ご返信いただくだけでも停止します。<br>
ご迷惑をおかけし、失礼いたしました。</p>
</main>
<script src="track.js"></script>
<script>
var r=(new URLSearchParams(location.search).get('r')||'').replace(/[^0-9a-f]/g,'').slice(0,10);
if(!r){document.getElementById('btn').disabled=true;document.getElementById('msg').textContent='このページはメールのリンクから開いてください（またはメールにご返信ください）。'}
function ask(){document.getElementById('btn').hidden=true;document.getElementById('confirm').hidden=false;}
function cancel(){document.getElementById('btn').hidden=false;document.getElementById('confirm').hidden=true;document.getElementById('msg').textContent='';}
function stop(){
  var b=document.getElementById('yes'),m=document.getElementById('msg');b.disabled=true;m.textContent='送信中…';
  fetch('https://160-251-215-139.sslip.io/lab/u',{method:'POST',headers:{'Content-Type':'text/plain'},body:r})
   .then(function(x){if(!x.ok)throw 0;document.getElementById('box').innerHTML='<p><b>停止しました。</b></p><p>今後、こちらからご連絡することはありません。ご対応いただきありがとうございました。</p>';})
   .catch(function(){b.disabled=false;m.textContent='うまく届きませんでした。お手数ですが、メールに「不要」とご返信ください。';});
}
</script>
</body>
</html>
